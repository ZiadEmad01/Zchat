<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZChat - تحت الصيانة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(135deg,#0f172a,#111827,#020617);
    color:#fff;
}

.container{
    width:100%;
    max-width:500px;
}

.logo{
    width:110px;
    height:110px;
    margin:0 auto 20px;
    border-radius:28px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    font-weight:900;
    box-shadow:0 0 30px rgba(0,114,255,.45);
}

.brand{
    font-size:clamp(32px,8vw,48px);
    font-weight:900;
    margin-bottom:25px;
}

.image{
    width:min(80vw,280px);
    margin-bottom:25px;
    animation:float 3s ease-in-out infinite;
}

.title{
    font-size:clamp(28px,7vw,42px);
    font-weight:900;
    line-height:1.3;
    margin-bottom:15px;
}

.desc{
    font-size:clamp(16px,4vw,20px);
    color:#d1d5db;
    line-height:1.9;
    margin-bottom:25px;
}

.badge{
    display:inline-block;
    padding:12px 22px;
    border-radius:50px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    font-size:15px;
    font-weight:700;
}

.loader{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.loader span{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#3b82f6;
    animation:bounce 1.2s infinite;
}

.loader span:nth-child(2){
    animation-delay:.2s;
}

.loader span:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:scale(.6);
        opacity:.5;
    }
    40%{
        transform:scale(1.3);
        opacity:1;
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

@media (max-width:480px){

    .logo{
        width:90px;
        height:90px;
        font-size:42px;
    }

    .image{
        width:220px;
    }

    .badge{
        font-size:14px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="logo">Z</div>

    <div class="brand">ZChat</div>

    <img
        class="image"
        src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png"
        alt="Maintenance">

    <h1 class="title">الموقع تحت الصيانة</h1>

    <p class="desc">
        نعمل حالياً على تطوير وتحسين ZChat
        لإضافة مزايا جديدة وتحسين الأداء.
        <br>
        سنعود للعمل في أقرب وقت.
    </p>

    <div class="badge">
        🚀 تحديثات جديدة قريباً
    </div>

    <div class="loader">
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

</body>
</html>
