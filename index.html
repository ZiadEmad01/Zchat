<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ZChat - تحت الصيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b17;
  --panel:#0e1530;
  --line:rgba(255,255,255,.09);
  --blue:#2f7bff;
  --cyan:#25d3ff;
  --text:#eef3ff;
  --muted:#93a0c2;
  --ok:#3ddc97;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  overflow-x:hidden;
  position:relative;
}
/* background glow */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(110px);z-index:0;pointer-events:none;
}
body::before{width:420px;height:420px;background:rgba(47,123,255,.28);top:-120px;right:-100px}
body::after{width:380px;height:380px;background:rgba(37,211,255,.16);bottom:-120px;left:-100px}

.wrap{
  position:relative;z-index:1;
  width:100%;max-width:980px;
  display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;
}

/* ---------- Info side ---------- */
.info{text-align:right}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo{
  width:64px;height:64px;border-radius:20px;flex:none;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,var(--cyan),var(--blue));
  box-shadow:0 10px 34px rgba(47,123,255,.45);
}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo svg{width:36px;height:36px}
.brand b{font-size:30px;font-weight:900;letter-spacing:.3px}

.status{
  display:inline-flex;align-items:center;gap:10px;
  padding:8px 16px;border-radius:999px;
  background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.28);
  color:var(--ok);font-size:14px;font-weight:700;margin-bottom:20px;
}
.status i{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}

h1{font-size:clamp(32px,6vw,54px);font-weight:900;line-height:1.25;margin-bottom:16px}
h1 span{background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.desc{font-size:clamp(16px,2.4vw,19px);line-height:1.95;color:var(--muted);max-width:480px;margin-bottom:28px}

/* progress */
.progress{max-width:440px;margin-bottom:28px}
.progress-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar div{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  box-shadow:0 0 18px rgba(37,211,255,.6);
  transition:width 2.2s cubic-bezier(.2,.8,.2,1);
}

/* countdown */
.count{display:flex;gap:10px;margin-bottom:30px;direction:ltr;justify-content:flex-end}
.count[hidden]{display:none}
.cell{
  min-width:74px;padding:12px 8px;text-align:center;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);
}
.cell strong{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.cell small{font-size:12px;color:var(--muted);font-weight:600}

.contact{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}
.contact a{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--text);text-decoration:none;font-size:15px;font-weight:600;
  padding:11px 18px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  transition:background .2s,border-color .2s;
}
.contact a:hover{background:rgba(47,123,255,.18);border-color:rgba(47,123,255,.5)}
.contact a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.contact svg{width:18px;height:18px}

/* ---------- Chat side ---------- */
.phone{
  position:relative;width:100%;max-width:400px;margin:0 auto;
  background:linear-gradient(180deg,#111a3a,#0b1128);
  border:1px solid var(--line);border-radius:32px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;
}
.phone-head{
  display:flex;align-items:center;gap:12px;padding:18px 20px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);
}
.avatar{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(140deg,var(--cyan),var(--blue));font-weight:900;
}
.avatar img{width:100%;height:100%;object-fit:contain}
.avatar svg{width:22px;height:22px}
.who b{display:block;font-size:16px}
.who small{font-size:12px;color:var(--ok);font-weight:600}

.chat{
  padding:20px 16px;min-height:340px;
  display:flex;flex-direction:column;gap:12px;
}
.msg{
  max-width:84%;padding:12px 16px;font-size:15px;line-height:1.7;font-weight:600;
  opacity:0;transform:translateY(8px) scale(.97);
  transition:opacity .35s,transform .35s;
}
.msg.show{opacity:1;transform:none}
.msg.bot{
  align-self:flex-start;color:var(--text);
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:20px 20px 20px 6px;
}
.msg.me{
  align-self:flex-end;color:#fff;
  background:linear-gradient(135deg,var(--blue),#1f5fe0);
  border-radius:20px 20px 6px 20px;
}
.typing{
  align-self:flex-start;display:none;gap:6px;padding:15px 18px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:20px 20px 20px 6px;
}
.typing.on{display:flex}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

.input{
  margin:0 16px 16px;padding:13px 18px;border-radius:16px;
  background:rgba(255,255,255,.04);border:1px dashed var(--line);
  color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center;
}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,151,.55)}70%,100%{box-shadow:0 0 0 10px rgba(61,220,151,0)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:34px}
  .info{text-align:center}
  .brand,.contact{justify-content:center}
  .desc,.progress{margin-inline:auto}
  .count{justify-content:center}
}
@media (max-width:420px){
  .cell{min-width:64px}
  .cell strong{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .msg{opacity:1;transform:none}
}

.contact button{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;
  color:#fff;font-size:15px;font-weight:700;padding:11px 18px;border-radius:14px;border:0;
  background:linear-gradient(135deg,var(--blue),#1f5fe0);box-shadow:0 8px 24px rgba(47,123,255,.35);
  transition:transform .15s,box-shadow .2s;
}
.contact button:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(47,123,255,.5)}
.contact button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.contact button svg{width:18px;height:18px}

/* ---------- Support bot ---------- */
.sb{
  position:fixed;z-index:50;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 24px));height:min(560px,calc(100dvh - 40px));
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#111a3a,#0b1128);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;transition:opacity .25s,transform .25s;
}
.sb.open{opacity:1;transform:none;pointer-events:auto}
.sb-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.sb-head .avatar{width:40px;height:40px;border-radius:13px}
.sb-head .who{flex:1}
.sb-close{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:10px}
.sb-close:hover{background:rgba(255,255,255,.08);color:var(--text)}
.sb-close:focus-visible,.sb-input input:focus-visible,.sb-send:focus-visible,.chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sb-msgs{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.sb-msgs .msg{opacity:1;transform:none;max-width:86%;font-size:14.5px;padding:10px 14px;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sb-msgs .msg{white-space:pre-line}
.msg a.act{display:inline-block;margin-top:8px;padding:8px 14px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.sb-chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 14px 10px}
.chip{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;
  padding:8px 13px;border-radius:999px;background:rgba(47,123,255,.12);border:1px solid rgba(47,123,255,.4);transition:background .2s}
.chip:hover{background:rgba(47,123,255,.3)}
.sb-input{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.sb-input input{flex:1;min-width:0;font-family:inherit;font-size:15px;color:var(--text);padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid var(--line)}
.sb-input input::placeholder{color:var(--muted)}
.sb-more{width:46px;border-radius:14px;cursor:pointer;color:var(--cyan);display:grid;place-items:center;
  background:rgba(47,123,255,.14);border:1px solid rgba(47,123,255,.4);transition:background .2s}
.sb-more svg{width:20px;height:20px}
.sb-more[aria-expanded="true"]{background:rgba(47,123,255,.38)}
.sb-more:disabled{opacity:.35;cursor:not-allowed}
.sb-more:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sb-send{border:0;cursor:pointer;width:46px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center}
.sb-send svg{width:20px;height:20px;transform:scaleX(-1)}
@media (max-width:560px){
  .sb{left:12px;right:12px;width:auto;height:min(78dvh,620px)}
}
.wrap{grid-template-columns:1fr;max-width:640px}
.info{text-align:center}
.brand,.contact{justify-content:center}
.desc,.progress{margin-inline:auto}
.count{justify-content:center}
</style>
</head>
<body>

<main class="wrap">

  <!-- ===== Info ===== -->
  <section class="info">
    <div class="brand">
      <div class="logo" id="logoBox"></div>
      <b>ZChat</b>
    </div>

    <div class="status"><i></i> جاري التحديث الآن</div>

    <h1>بنجهّز لك <span>تجربة أسرع وأحلى</span></h1>

    <p class="desc">
      الموقع تحت الصيانة مؤقتاً عشان نحسّن الأداء ونضيف مزايا جديدة.
      بياناتك ورسايلك في أمان تام، وهنرجع في أقرب وقت.
    </p>

    <div class="progress" aria-label="تقدم التحديث">
      <div class="progress-top"><span>تقدم التحديث</span><span id="pct">0%</span></div>
      <div class="bar"><div id="fill"></div></div>
    </div>

    <div class="count" id="count" hidden>
      <div class="cell"><strong id="cs">00</strong><small>ثانية</small></div>
      <div class="cell"><strong id="cm">00</strong><small>دقيقة</small></div>
      <div class="cell"><strong id="ch">00</strong><small>ساعة</small></div>
      <div class="cell"><strong id="cd">00</strong><small>يوم</small></div>
    </div>

    <div class="contact">
      <button type="button" id="supportBtn" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        تواصل مع الدعم
      </button>
      <a href="#" id="tgLink" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/></svg>
        تابع آخر الأخبار
      </a>
    </div>
  </section>

  </main>


<!-- ===== Support bot ===== -->
<aside class="sb" id="sb" role="dialog" aria-label="دعم ZChat" aria-hidden="true">
  <div class="sb-head">
    <div class="avatar" id="sbAvatar"></div>
    <div class="who"><b>دعم ZChat</b><small>رد تلقائي · متاح الآن</small></div>
    <button type="button" class="sb-close" id="sbClose" aria-label="إغلاق">×</button>
  </div>
  <div class="sb-msgs" id="sbMsgs" aria-live="polite">
    <div class="typing" id="sbTyping"><span></span><span></span><span></span></div>
  </div>
  <div class="sb-chips" id="sbChips"></div>
  <div class="sb-input">
    <button type="button" class="sb-more" id="sbMore" aria-label="الاقتراحات" aria-expanded="false" title="الاقتراحات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
    </button>
    <input type="text" id="sbInput" placeholder="اكتب سؤالك…" autocomplete="off" aria-label="اكتب سؤالك">
    <button type="button" class="sb-send" id="sbSend" aria-label="إرسال">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l6 2 2 6 3-4 5 4z"/></svg>
    </button>
  </div>
</aside>

function mountLogo(box){
  if(CONFIG.logo){
    const img = new Image();
    img.alt = "ZChat";
    img.onerror = () => { box.innerHTML = fallbackSVG; };
    img.src = CONFIG.logo;
    box.appendChild(img);
    // اللوجو الحقيقي غالباً له خلفية خاصة
    box.style.background = "#0b0d1c";
    box.style.boxShadow = "0 10px 34px rgba(47,123,255,.45)";
  }else{
    box.innerHTML = fallbackSVG;
  }
}

const fill = document.getElementById("fill");
const pct = document.getElementById("pct");
setTimeout(()=>{ fill.style.width = CONFIG.progress + "%"; }, 300);
(function countUp(){
  let n = 0;
  const t = setInterval(()=>{
    n++; pct.textContent = n + "%";
    if(n >= CONFIG.progress) clearInterval(t);
  }, 2200 / CONFIG.progress);
})();

/* ===================== العداد ===================== */
if(CONFIG.returnAt){
  const target = new Date(CONFIG.returnAt).getTime();
  const box = document.getElementById("count");
  const pad = n => String(n).padStart(2,"0");
  const tick = () => {
    const d = Math.max(0, target - Date.now());
    document.getElementById("cd").textContent = pad(Math.floor(d/864e5));
    document.getElementById("ch").textContent = pad(Math.floor(d/36e5)%24);
    document.getElementById("cm").textContent = pad(Math.floor(d/6e4)%60);
    document.getElementById("cs").textContent = pad(Math.floor(d/1e3)%60);
    if(d === 0) location.reload();
  };
  if(!isNaN(target)){ box.hidden = false; tick(); setInterval(tick, 1000); }
}

(function(){

  const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
  const pick=a=>a[Math.floor(Math.random()*a.length)];

  function returnText(){
    const d=new Date(CONFIG.returnAt||"");

  const INTENTS=[

    {id:"thanks", k:["شكرا","تسلم","جزاك","ميرسي","thanks","كتر خيرك"], a:()=>pick(["العفو! لو احتجت أي حاجة أنا هنا 💙","تحت أمرك دايماً 😊"])},
    {id:"bye",    k:["مع السلامه","باي","تصبح علي خير","في امان الله","bye"], a:()=>"مع السلامة! نشوفك قريب على ZChat 💙"},
    {id:"who",    k:["انت مين","انت ايه","انت بوت","انت روبوت","اسمك ايه","مين انت"], a:()=>"أنا مساعد دعم ZChat الآلي 🤖 بجاوب على الأسئلة الشائعة وباخد بلاغاتك واقتراحاتك وأوصّلها للفريق."},

    {id:"data",   k:["رساي","رسائل","بيانات","داتا","امان","ضاع","اتمسح","اتحذف","محادث","خصوصيه"], a:()=>"كل بياناتك ورسايلك محفوظة وماتأثرتش بالصيانة 🔒 التحديث على الواجهة والأداء بس."},
    {id:"login",  k:["دخول","سجل","تسجيل","باسورد","كلمه السر","كلمه المرور","نسيت","login","اكونت","حسابي"], a:()=>"تسجيل الدخول مش هيشتغل لحد ما الموقع يرجع. أول ما نرجع جرّب بنفس بياناتك، ولو المشكلة فضلت ابعتلي بلاغ وأنا أوصّله للفريق."},

    {id:"price",  k:["مجاني","بفلوس","سعر","اشتراك","تكلفه","ببلاش"], a:()=>"الاستخدام مجاني حالياً 🎉 ولو حصل أي تغيير هنعلنه على الموقع."},

  function match(text){
    const n=norm(text); let best=null, score=0;
    for(const it of INTENTS){
      let s=0; for(const k of it.k){ const kk=norm(k); if(n.includes(kk)) s+=kk.length>4?2:1; }
      if(s>score){score=s;best=it;}
    }
    return best;
  }
  async function askAI(text){
    if(!CONFIG.aiEndpoint) return null;
    try{
      const r=await fetch(CONFIG.aiEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
      const d=await r.json(); return d.reply||null;
    }catch(e){ return null; }
  }

  let started=false, form=null, busy=false;
  const PLACEHOLDER={name:"اكتب اسمك…",user:"اكتب اليوزر نيم…",text:"اكتب هنا…"};

  }
  async function botSay(text,action){

    typ.classList.remove("on"); bubble("bot",text,action);

  function renderChips(list){

  }
  function mailLink(f){
    const body="النوع: "+f.kind+"\nالاسم: "+f.name+"\nاليوزر نيم: "+f.user+"\nالرسالة: "+f.text;
    return "mailto:"+CONFIG.email+"?subject="+encodeURIComponent("ZChat - "+f.kind+" من "+f.name)+"&body="+encodeURIComponent(body);
  }

  /* الإرسال الفعلي للإيميل عبر FormSubmit */
  async function submit(f){
    typ.classList.add("on"); msgs.scrollTop=msgs.scrollHeight;
    let ok=false;
    try{
      const c=new AbortController(), t=setTimeout(()=>c.abort(),15000);
      const r=await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(CONFIG.email),{
        method:"POST",signal:c.signal,
        headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({name:f.name,username:f.user,type:f.kind,message:f.text,
          _subject:"ZChat - "+f.kind+" من "+f.name,_template:"table",_captcha:"false"})
      });
      clearTimeout(t);
      const d=await r.json().catch(()=>({}));
      ok=r.ok && (d.success===true||d.success==="true");
      if(!ok) console.warn("ZChat: فشل الإرسال",r.status,d);
    }catch(e){ console.warn("ZChat: فشل الإرسال",e); }
    typ.classList.remove("on");
    if(ok) bubble("bot","تم إرسال رسالتك بنجاح ✅\nسيتم التواصل معك قريباً يا "+f.name+" 💙");
    else bubble("bot","معلش، ماقدرتش أبعت الرسالة تلقائياً دلوقتي 😕\nدوس على الزرار وابعتها بالإيميل بدل كده:",{href:mailLink(f),label:"إرسال بالإيميل"});
  }

  async function handle(text,id){
    if(busy) return; busy=true;
    bubble("me",text); chips.innerHTML=""; syncMore();
    const n=norm(text);
    try{
      if(form){
        if(form.step==="name"){
          if(n.length<2){ await botSay("ممكن تكتب اسمك بشكل أوضح؟"); }
          else{ form.name=text.slice(0,60); setStep("user"); await botSay("أهلاً يا "+form.name+" 👋\nإيه اليوزر نيم بتاعك على ZChat؟ (مثال: @ahmed)"); }
        }else if(form.step==="user"){
          const u=text.replace(/^@+/,"").replace(/\s+/g,"").slice(0,40);
          if(u.length<2){ await botSay("اليوزر نيم قصير جداً، اكتبه تاني من فضلك."); }
          else{ form.user="@"+u; setStep("text"); await botSay(form.kind==="اقتراح"?"تمام. اكتب اقتراحك بالتفصيل:":"تمام. اوصف المشكلة اللي بتواجهها:"); }
        }else{
          if(n.length<5){ await botSay("ممكن توضح أكتر شوية عشان الفريق يفهمك؟"); }
          else{
            const f=form; f.text=text.slice(0,1500); form=null; input.placeholder="اكتب سؤالك…";
            await submit(f);
          }
        }
      }else{
        const it=id?INTENTS.find(x=>x.id===id):match(text);
        if(it){
          if(it.form){ form={kind:it.form}; setStep("name"); chips.innerHTML=""; await botSay(it.a()); await botSay("اسمك إيه؟"); }
          else await botSay(it.a());
        }else{
          const ai=await askAI(text);
          await botSay(ai||"مش متأكد إني فهمت قصدك 🤔 لو عندك مشكلة أو اقتراح قولّي «عندي مشكلة» أو «عندي اقتراح» وأنا هاخد بياناتك وأوصّلها للفريق.");
        }
      }
    }finally{
      syncMore();
      busy=false; input.focus();
    }
  }

  async function start(){
    started=true;
    await botSay("أهلاً بيك في دعم ZChat 👋");
    await botSay("الموقع تحت صيانة مؤقتة. اسألني أي حاجة أو اختار من اللي تحت:");
    renderChips(QUICK); syncMore();
  }
  function open(){
    sb.classList.add("open"); sb.setAttribute("aria-hidden","false");
    if(!started) start();
    setTimeout(()=>input.focus(),250);
  }
  function close(){ sb.classList.remove("open"); sb.setAttribute("aria-hidden","true"); btn.focus(); }
  function syncMore(){ more.disabled=!!form; more.setAttribute("aria-expanded",String(chips.children.length>0)); }
  more.addEventListener("click",()=>{
    if(form||busy) return;
    if(chips.children.length) chips.innerHTML=""; else { renderChips(QUICK); msgs.scrollTop=msgs.scrollHeight; }
    syncMore();
  });
  const send=()=>{ const v=input.value.trim(); if(v){ input.value=""; handle(v); } };

  btn.addEventListener("click",()=>sb.classList.contains("open")?close():open());
  document.getElementById("sbClose").addEventListener("click",close);
  document.getElementById("sbSend").addEventListener("click",send);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); } });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && sb.classList.contains("open")) close(); });
})();
</script>
</body>
